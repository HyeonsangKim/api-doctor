# 지원 데이터셋 등록 (FR-001)
#
# 아래 사실은 2026-09-27 실제 호출로 확인했다 (sample 키, 공개 데이터).
#  · 서비스명 SeoulPublicLibraryInfo, 서비스 전체 216건
#  · 페이지는 query 파라미터가 아니라 **경로의 START/END 범위**다
#  · 인증키가 **URL 경로에 들어간다**
#  · HTTPS 는 지원하지 않는다 (TLS 핸드셰이크 실패). http 만 응답한다
#  · /json/ 로 요청해도 오류는 XML 로 온다

dataset_id: seoul_library
display_name: 서울시 공공도서관 현황정보
contract_id: seoul_library_scope
contract_version: v1

# 스냅샷을 지정하지 않았을 때 쓰는 것. 추측하지 않고 명시한다.
# seoul_library_authfail 은 AC-06 시연용이므로 기본이 아니다.
default_snapshot: seoul_library_scope1_5

# PRD §4.5: HTTPS 미확인 데이터 소스는 key 를 전송하는 live 지원에서 제외한다.
# 이 endpoint 는 HTTPS 를 지원하지 않는 것이 실측으로 확인됐으므로
# live_ready 는 앞으로도 거짓이다. fixture 전용이다.
live_ready: false
live_blockers:
  - HTTPS 미지원 (2026-09-27 실측: TLS 핸드셰이크 실패, http 만 응답)
  - 인증키가 URL 경로에 포함되는 방식이라 키 유출 경계 재설계 필요
  - 전체 216건 수집에는 발급 키 필요 (sample 키는 1~5행 한정)

provenance:
  source_kind: live_capture
  service: SeoulPublicLibraryInfo
  captured_with: sample key (공개 예제 키)
  captured_at: "2026-09-27"
  reference_url: https://data.seoul.go.kr/dataList/OA-15480/A/1/datasetView.do
  api_guide_url: https://data.seoul.go.kr/together/guide/useGuide.do
  license_note: >-
    서울 열린데이터광장 공공데이터. 출처를 표시한다.
    원문 재배포 조건은 별도로 확인하지 않았다.

# 실제 요청 형태. {KEY} 는 broker 가 주입하는 자리표시자이며
# 후보 코드와 모델은 실제 키를 보지 못한다 (PRD §4.5).
request_shape:
  template: "{scheme}://openapi.seoul.go.kr:8088/{KEY}/json/SeoulPublicLibraryInfo/{start}/{end}/"
  pagination: path_range      # 1-based inclusive
  key_location: url_path

allowed_endpoints:
  - method: GET
    url_prefix: http://openapi.seoul.go.kr:8088/
    allowed_params: []        # 경로 기반이라 query 파라미터를 쓰지 않는다

# 공급자 오류 코드 분류 (FR-006, AC-06).
# 2026-09-27 실호출로 확인한 코드다. 신뢰된 분류기가 **모델보다 먼저** 중단한다.
provider_errors:
  INFO-000: ok
  INFO-100: auth           # 인증키가 유효하지 않습니다
  INFO-200: empty          # 해당하는 데이터가 없습니다
  ERROR-300: bad_request
  ERROR-301: bad_request
  ERROR-331: bad_request
  ERROR-332: bad_request
  ERROR-333: bad_request
  ERROR-334: bad_request
  ERROR-335: bad_request   # 샘플키 범위 초과
  ERROR-336: bad_request
  ERROR-500: provider_fault
  ERROR-600: provider_fault
  ERROR-601: provider_fault

allowed_doc_domains:
  - data.seoul.go.kr

skill: seoul_library
