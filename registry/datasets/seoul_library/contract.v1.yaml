# 불변 조회 계약 (FR-001, PRD §3.2)
#
# 사람이 검토해 고정한다. 모델은 이 파일을 만들지도 바꾸지도 못하며
# 에이전트에게는 중립 요약만 전달된다.

contract_id: seoul_library_scope
version: v1

query:
  scope_id: all

# 전체성 기준. 후보가 요청한 페이지 수로 이 범위를 축소할 수 없다.
completeness:
  expected_record_count: 12
  identity_key: LBRRY_SEQ_NO

required_fields:
  - name: LBRRY_SEQ_NO
    type: str
    nullable: false
  - name: LBRRY_NAME
    type: str
    nullable: false
  - name: ADRES
    type: str
    nullable: true
  - name: TEL_NO
    type: str
    nullable: true

# 값 의미 검사. 스키마만으로 안 잡히는 손실을 본다.
value_rules:
  - rule_id: seq_no_is_digits
    field: LBRRY_SEQ_NO
    kind: regex
    pattern: '^[0-9]+$'
  - rule_id: name_not_blank
    field: LBRRY_NAME
    kind: not_blank

# 감사자가 반드시 다뤄야 하는 위험 영역 (PRD §3.2 audit_requirements).
# 지원하지 않는 위험 영역을 일괄 요구하지 않는다.
audit_requirements:
  - risk_id: pagination_boundary
    description: 마지막 페이지 종료 조건 오류로 레코드가 누락될 수 있다
  - risk_id: mapping_preservation
    description: 중첩 응답 경로를 잘못 읽어 필드가 사라질 수 있다
