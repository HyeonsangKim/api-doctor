<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 1120" role="img" aria-labelledby="t1 d1">
<title id="t1">API닥터 신뢰 영역 아키텍처</title>
<desc id="d1">사용자 영역의 CLI가 신뢰 영역의 런타임을 호출한다. 런타임이 메인 에이전트에게 작업 봉투를 발급하고, 메인은 네 전문 에이전트에게 위임한다. 모든 도구 호출은 도구 게이트웨이를, 모든 추론은 모델 게이트웨이를 지난다. 후보 코드는 네트워크 없는 실행 영역에서만 돌고 동결 스냅샷으로만 데이터를 받는다. 최종 판정은 고정 검증기와 종료 게이트가 한다.</desc>
<style>
.zb{rx:14;ry:14;stroke-width:1.5}
.zl{font:600 15px "IBM Plex Sans KR",sans-serif}
.zs{font:400 12px "IBM Plex Mono",monospace}
.nd{rx:8;ry:8;stroke-width:1.4}
.nt{font:600 14px "IBM Plex Sans KR",sans-serif;text-anchor:middle}
.ns{font:400 11.5px "IBM Plex Mono",monospace;text-anchor:middle}
.e{fill:none;stroke-width:1.7}
.ex{fill:none;stroke-width:3.2}
.ed{fill:none;stroke-width:1.8;stroke-dasharray:6 5}
.el{font:500 12px "IBM Plex Mono",monospace}
.bl{font:600 12.5px "IBM Plex Sans KR",sans-serif}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#69717f"/></marker>
<marker id="aT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5fb8"/></marker>
<marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a96a12"/></marker>
<marker id="aS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b13636"/></marker>
</defs>

<!-- Zone U -->
<rect class="zb" x="30" y="26" width="320" height="104" fill="#f4f5f8" stroke="#dfe2e9"/>
<text class="zl" x="50" y="52" fill="#39404e">Zone U · 사용자</text>
<text class="zs" x="185" y="52" fill="#69717f">OS user: operator</text>
<rect class="nd" x="50" y="68" width="280" height="44" fill="#fff" stroke="#c9cfda"/>
<text class="nt" x="190" y="87" fill="#14161c">api-doctor CLI</text>
<text class="ns" x="190" y="103" fill="#69717f">run · show · replay · eval</text>

<!-- Zone A -->
<rect class="zb" x="30" y="162" width="1580" height="268" fill="#fdf5e8" stroke="#e8d2a6"/>
<text class="zl" x="50" y="188" fill="#a96a12">Zone A · 에이전트 영역</text>
<text class="zs" x="238" y="188" fill="#a96a12">LLM 이 판단하는 유일한 곳 — 코드를 쓰거나 실행할 수 없다</text>

<rect class="nd" x="50" y="204" width="250" height="90" fill="#fff" stroke="#d9b877" stroke-width="2.4"/>
<text class="nt" x="175" y="231" fill="#14161c">main · recovery_lead</text>
<text class="ns" x="175" y="251" fill="#69717f">담당자 · 질문 · 재계획</text>
<text class="ns" x="175" y="268" fill="#69717f">종료 요청</text>
<text class="ns" x="175" y="285" fill="#a96a12">성공을 확정할 수 없다</text>

