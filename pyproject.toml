[project]
name = "api-doctor"
version = "0.2.0"
description = "메인 에이전트와 4개 전문 에이전트의 공공 API 복구"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "typer>=0.15",
    "rich>=13.9",
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "httpx>=0.28",
]

[project.optional-dependencies]
agents = [
    "langgraph>=0.2.60",
    "langchain-core>=0.3.29",
    "langchain-openai>=0.2.14",
    "deepagents>=0.7.19",
]

[project.scripts]
api-doctor = "api_doctor.cli.main:app"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-cov>=6.0"]

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
